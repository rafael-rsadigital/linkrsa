<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6e45e8" />
    <title>Acesso restrito — Link RSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <style>
      :root{--purple:#6e45e8;--ink:#241e35;--muted:#817b8f;--lavender:#f1edff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f1edff,#fffafc);color:var(--ink);font-family:"DM Sans",sans-serif}.login-card{width:min(100%,440px);padding:42px;border:1px solid #e8e3f0;border-radius:26px;background:#fff;box-shadow:0 25px 70px rgba(60,35,120,.13);text-align:center}.mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 24px;border-radius:18px;background:var(--purple);color:#fff;font-weight:800;letter-spacing:-.08em}.eyebrow{margin:0 0 13px;color:var(--purple);text-transform:uppercase;letter-spacing:.17em;font-size:10px;font-weight:800}.login-card h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:39px;line-height:1;letter-spacing:-.05em}.login-card p{margin:15px auto 26px;color:var(--muted);font-size:14px;line-height:1.6}.login-button{display:flex;align-items:center;justify-content:center;width:100%;padding:14px 18px;border-radius:12px;background:var(--purple);color:#fff;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 10px 22px rgba(110,69,232,.22)}.login-button:hover{background:#4c2baa}.allowed{margin-top:17px!important;font-size:11px!important}.allowed strong{color:var(--ink)}.back{display:inline-block;margin-top:27px;color:var(--purple);font-size:12px;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="login-card"><div class="mark">LR</div><p class="eyebrow">acesso administrativo</p><h1>Entrar no painel</h1><p>Faça login com a conta autorizada para editar a página pública, fotos, produtos, serviços e links.</p><a class="login-button" href="/auth/login?next=/admin">Entrar com minha conta</a><p class="allowed">Acesso permitido somente para<br /><strong>atendimento.rsadigital@gmail.com</strong></p><a class="back" href="/">← voltar para a página pública</a></main>
  </body>
</html>
